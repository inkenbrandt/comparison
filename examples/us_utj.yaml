# US-UTJ declarations from docs/input_contract.md and docs/decisions.md.
# Data paths are local inputs that are not distributed (D-014).
# Relative paths resolve against this file's directory.

stations:
  US-UTJ:
    name: UFLUX Bluff
    timezone: "UTC-07:00"            # user-provided (D-002)
    day_definition: local_standard_time
    interval_label: start            # provisional; from .ini TIMESTAMP_START (D-015 q1)
    latitude: 37.281746              # UGS station_attribute_view; also places the footprint grid (D-036)
    longitude: -109.53489            # AmeriFlux lists 37.2818, -109.5348 (4 decimals, ~9 m)
    elevation_m: 1281
    land_cover: CRO

# OpenET products: mm/day by API request (D-003); interpolated daily (D-011).
# Day boundary of the OpenET daily product is unresolved -> unknown.
# Raster scaling is declared (D-026): the GeoTIFFs carry no scale/offset tags, and
# their header nodata is -9999 (checked against the declaration on every read).
x-scaling: &scaling {raster_scaling: declared, scale_factor: 1.0, add_offset: 0.0, nodata: -9999.0}
products:
  disalexi: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  eemetric: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  ensemble: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling, is_ensemble: true}
  geesebal: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  ptjpl:    {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  sims:     {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  ssebop:   {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}

site_aliases: {}
model_aliases: {}

station_tables:
  - path: ../US-UTJ_daily.csv
    site_id: US-UTJ
    date_column: date
    date_format: "%Y-%m-%d"
    reference_columns: {et_raw: ET, et_corrected: ET_corr}
    gap_flag_column: ET_gap
    closure_factor_column: ebc_cf
    reference_et_column: gridMET_ETr       # imputation driver (D-042); the station's own ET_fill uses it
    units: {ET: mm/day, ET_corr: mm/day, gridMET_ETr: mm/day}   # provisional for station (D-003)

extracted_tables:
  - name: us_utj_set_a
    path: ../station_oet_US-UTJ.parquet
    site_column: station_id
    model_column: model
    date_column: footprint_date
    value_columns:
      ET_fp: upstream_footprint_weighted   # D-006
      ET_mean: source_region_mean          # D-007; region changes daily
    units: {ET_fp: mm/day, ET_mean: mm/day}
    footprint_set_id: US-UTJ_set_A_20261005
    footprint_method: et_weighted_unverified   # D-009
    weight_sum_column: unity_check
    retained_weight_column: valid_weight_fraction
    retained_weight_denominator: normalized_truncated_footprint   # D-008
    model_asset_column: openet_file
    footprint_asset_column: footprint_file
    source_path_column: openet_path

openet_rasters:
  - root: "M:/My Drive/OpenET_Daily_Tiffs/US-UTJ_US-CdM"

footprint_sets:
  - set_id: US-UTJ_set_A_20261005
    root: "M:/My Drive/footprints/US-UTJ"
    recursive: false                   # set B lives in weighted/ (D-016)
    layers: [etw]
    weighting_method: et_weighted_unverified
    temporal_weighting: reference_et_weighted   # reproduced: NLDAS grass ETo, negatives kept (D-036)
    value_semantics: normalized_cell_weight

  # Set B (2026-10-12) is the set used for raster re-extraction (D-016).
  - set_id: US-UTJ_set_B_etw_20261012
    root: "M:/My Drive/footprints/US-UTJ/weighted"
    layers: [etw]
    weighting_method: et_weighted_unverified       # negative weights present (D-027)
    temporal_weighting: reference_et_weighted      # reproduced: NLDAS grass ETo, negatives kept (D-036)
    value_semantics: normalized_cell_weight
    domain_capture_csv: "M:/My Drive/footprints/domain_outputs/US-UTJ_daily_domain_results.csv"
    domain_capture_column: et_weighted_coverage_pct
  - set_id: US-UTJ_set_B_mean_20261012
    root: "M:/My Drive/footprints/US-UTJ/non_weighted"
    layers: [mean]
    weighting_method: time_mean_unverified
    temporal_weighting: time_mean                  # uses no ET, so target-independent (D-032)
    value_semantics: normalized_cell_weight
    domain_capture_csv: "M:/My Drive/footprints/domain_outputs/US-UTJ_daily_domain_results.csv"
    domain_capture_column: mean_coverage_pct

  # Footprints aggregated by etcompare from one per-timestep fluxfootprints stack
  # (tools/upstream/run_timestep_footprints.py; D-036, D-037). The two sets differ only
  # in the temporal weight. NLDAS ETo is primary (user decision 2026-10-14); measured LE
  # is the sensitivity set.
  - set_id: US-UTJ_nldas_eto_20261014
    root: ../outputs/footprints/US-UTJ/nldas_eto_weighted
    layers: [nldaseto]
    weighting_method: "etcompare_aggregation:nldas_eto_weighted"
    temporal_weighting: reference_et_weighted     # NLDAS-forcing grass ETo, not land-model ET
    value_semantics: normalized_cell_weight
  - set_id: US-UTJ_measured_le_20261014
    root: ../outputs/footprints/US-UTJ/measured_le_weighted
    layers: [measle]
    weighting_method: "etcompare_aggregation:measured_le_weighted"
    temporal_weighting: measured_et_weighted      # target measurements: sensitivity only
    value_semantics: normalized_cell_weight

# Temporal aggregation of the per-timestep stack. Shared choices follow production
# (footprint_workflow_v2-1.ipynb): 08-20 h half-hours only (applied upstream), each
# timestep renormalized, equal 30-min durations.
footprint_aggregations:
  - method_id: nldas_eto_weighted
    temporal_weighting: reference_et_weighted
    weight_column: nldas_eto_mm_h
    include_duration: true
    basis: renormalized_per_timestep
    negative_weight_policy: exclude_timestep   # hourly ETo can be < 0; production kept it (D-036)
    gap_policy: exclude_timestep
    night_policy: include                      # night already outside the 08-20 h window
  - method_id: measured_le_weighted
    temporal_weighting: measured_et_weighted
    weight_column: le_w_m2                     # LE_1_1_1 (QC'd), proportional to ET
    include_duration: true
    basis: renormalized_per_timestep
    negative_weight_policy: exclude_timestep   # as footprint_workflow.py; avoids negative weights
    gap_policy: exclude_timestep               # missing LE half-hours are left out
    night_policy: include

raster_extractions:
  - name: us_utj_set_b_etw
    site_id: US-UTJ
    footprint_set_id: US-UTJ_set_B_etw_20261012
    methods: [footprint, footprint_common_support, pixel_window, nearest_tower_pixel]
    window_sizes: [3]
    negative_weight_tolerance: 1.0e-9   # round-off only (D-027)
    start: "2024-06-05"                 # station record (contract 4.1)
    end: "2025-10-09"
  # Step 6: the set-B time-mean layer, extracted with the same footprint methods and
  # tolerance so it can be compared with etw on frozen dates.
  - name: us_utj_set_b_mean
    site_id: US-UTJ
    footprint_set_id: US-UTJ_set_B_mean_20261012
    methods: [footprint, footprint_common_support]
    negative_weight_tolerance: 1.0e-9
    start: "2024-06-05"
    end: "2025-10-09"
  # Primary extraction (user decision 2026-10-14): NLDAS-ETo-weighted footprints.
  - name: us_utj_nldas_eto
    site_id: US-UTJ
    footprint_set_id: US-UTJ_nldas_eto_20261014
    methods: [footprint, footprint_common_support, pixel_window, nearest_tower_pixel]
    window_sizes: [3]
    negative_weight_tolerance: 1.0e-9
    start: "2024-06-05"
    end: "2025-10-09"
  # Sensitivity: measured-LE-weighted footprints, same stack, methods and tolerance.
  - name: us_utj_measured_le
    site_id: US-UTJ
    footprint_set_id: US-UTJ_measured_le_20261014
    methods: [footprint, footprint_common_support]
    negative_weight_tolerance: 1.0e-9
    start: "2024-06-05"
    end: "2025-10-09"

# Comparison cohorts (guide step 7; D-039). Each fixes its sample before any scoring.
# No quality threshold is adopted yet (D-008): min_retained_frac is left unset.
x-nldas-fp: &nldas_fp {extraction_method: footprint_conservative, footprint_set_id: US-UTJ_nldas_eto_20261014}
x-all-models: &all_models [disalexi, eemetric, ensemble, geesebal, ptjpl, sims, ssebop]
comparisons:
  # All-model rankings on the primary footprints, one cohort per reference variant.
  - comparison_id: utj_rank_corrected_inclusive
    kind: common_date
    models: *all_models
    reference_variants: [et_corrected_inclusive]
    sides: [*nldas_fp]
    sources: [us_utj_nldas_eto]
  - comparison_id: utj_rank_corrected_measured
    kind: common_date
    models: *all_models
    reference_variants: [et_corrected_measured]
    sides: [*nldas_fp]
    sources: [us_utj_nldas_eto]
  # Closure sensitivity: raw vs corrected on the same measured days and models (D-004).
  - comparison_id: utj_closure_all_models
    kind: paired_reference
    common_models: true
    models: *all_models
    reference_variants: [et_raw, et_corrected_measured]
    sides: [*nldas_fp]
    sources: [us_utj_nldas_eto]
  # Coverage summaries only (unequal days per model; never a ranking).
  - comparison_id: utj_coverage
    kind: model_available
    models: *all_models
    reference_variants: [et_corrected_inclusive]
    sides: [*nldas_fp]
    sources: [us_utj_nldas_eto]
  # Extraction-method comparison: footprint vs fixed 3x3 window, frozen per model.
  - comparison_id: utj_footprint_vs_window
    kind: paired_method
    models: *all_models
    reference_variants: [et_corrected_measured]
    sides:
      - *nldas_fp
      - {extraction_method: pixel_window_3x3, footprint_set_id: none}
    sources: [us_utj_nldas_eto]
  # Pairwise example on the two long-record single models (2024-2025).
  - comparison_id: utj_pair_eemetric_ssebop
    kind: pairwise_model
    models: [eemetric, ssebop]
    reference_variants: [et_corrected_measured]
    sides: [*nldas_fp]
    sources: [us_utj_nldas_eto]
  # Ranking-sensitivity cohorts (step 11; D-049). Each is an all-model cohort frozen across
  # both of its reference variants or both of its sides, so rankings per variant or side use
  # identical days. Closure: raw vs corrected on measured days. Extraction: footprint vs 3x3.
  - comparison_id: utj_rank_closure
    kind: common_date
    models: *all_models
    reference_variants: [et_raw, et_corrected_measured]
    sides: [*nldas_fp]
    sources: [us_utj_nldas_eto]
  - comparison_id: utj_rank_methods
    kind: common_date
    models: *all_models
    reference_variants: [et_corrected_measured]
    sides:
      - *nldas_fp
      - {extraction_method: pixel_window_3x3, footprint_set_id: none}
    sources: [us_utj_nldas_eto]
  # Pre-extracted producer table (set A): regression check of the 260 common dates.
  - comparison_id: utj_set_a_common
    kind: common_date
    models: *all_models
    reference_variants: [et_corrected_inclusive]
    sides: [{extraction_method: upstream_footprint_weighted, footprint_set_id: US-UTJ_set_A_20261005}]
    sources: [us_utj_set_a]

# Crop-height model for footprint zone E (alfalfa). Its season columns define the growing
# season (user decision 2026-10-15; D-042); active_k must be non-null exactly in season.
crop_height_tables:
  - name: utj_zone_e_crop_height
    path: ../US-UTJ_20240101_20251230.csv
    site_column: stationid
    date_column: date
    height_column: height_cm
    height_units: cm
    season_start_column: season_start
    season_end_column: season_end
    active_column: active_k

# Period totals (guide step 8; D-041, D-042): sums of each cohort's daily depths, plus
# estimated totals from imputed days (user decision 2026-10-15). Imputed values are kept
# in separate columns of the daily-estimates table.
period_aggregations:
  - aggregation_id: utj_periods
    periods: [month, growing_season, year, water_year]
    water_year_start_month: 10        # USGS convention; WY2025 = 2024-10-01..2025-09-30
    growing_season_source: utj_zone_e_crop_height
    estimation_method: reference_et_fraction   # interpolate ET/gridMET ETr, as the station fill does
    estimation_max_gap_days: 14                # adopted default (user, 2026-10-15; D-042)
    estimation_min_completeness: 0.5           # adopted default (user, 2026-10-15; D-042)

# Performance metrics (guide step 9; D-044) on each cohort's common mask: daily pairs and,
# separately, every period product of utj_periods. Near-zero tolerances are Provisional
# (D-044): they decide only when a denominator counts as zero, and were set before scoring.
metric_sets:
  - metric_set_id: utj_metrics
    metrics: [mbe, mae, rmse, bias_corrected_rmse, percent_bias, nrmse_mean, nrmse_mean_percent,
              pearson_r, pearson_r_squared, ols_slope, ols_intercept, nse, kge_2009]
    daily_tolerance: {mean: 0.01, std: 0.001}    # mm d-1
    period_tolerance: {mean: 0.1, std: 0.01}     # mm
    period_aggregations: [utj_periods]
    period_products: [partial_sum, complete_total, estimated_total]
    cumulative_error: true

# Paired moving-block bootstrap intervals (guide step 10; D-047, D-048). All values are
# Provisional defaults fixed before any interval was computed; no block length is adopted.
# Every declared length is reported side by side as a sensitivity comparison, and none is
# to be chosen because its intervals are tighter. Station level only.
bootstrap:
  - bootstrap_id: utj_block_bootstrap
    metric_set: utj_metrics
    block_lengths: [7, 14, 28]        # daily samples; sensitivity candidates, not standards
    period_block_lengths: [1]         # whole periods (months etc.) resampled as units
    seed: 20261016
    n_replicates: 2000
    confidence_level: 0.95
    interval_methods: [percentile]
    min_blocks: 10                    # disjoint full-length blocks needed for an interval
    min_valid_fraction: 0.9
    segment_boundary: water_year      # blocks never span WY boundaries (as utj_periods)
    water_year_start_month: 10
    acf_max_lag: 28
    contrasts: true

# Station-level rankings and paired model contrasts (guide step 11; D-049, D-050). All
# values are Provisional defaults fixed before any ranking was computed. Rankings use the
# step-9 point estimates and the step-10 replicates at every bootstrap block length side by
# side; no block length is adopted (D-047, D-048). Ranks describe one station; they are not
# a verdict on which model is best.
rankings:
  - ranking_id: utj_model_ranking
    metric_set: utj_metrics
    bootstrap: utj_block_bootstrap
    metrics:                          # directions must match RANKING_DIRECTIONS
      mae: lower
      rmse: lower
      nrmse_mean: lower
      pearson_r: higher
      pearson_r_squared: higher
      nse: higher
      kge_2009: higher
      mbe: closest_to_zero            # ranked by |MBE|
      percent_bias: closest_to_zero   # ranked by |percent bias|
    equivalence_margins: {}           # none declared: equivalence is not_assessed (open)
    network_summaries: [equal_site_mean, observation_weighted_mean,
                        sqrt_observation_weighted_mean, pooled_rmse]
    formal_tests: false               # every contrast is exploratory
    year_subsets: true                # rank each calendar year of multi-year cohorts
    comparisons: [utj_rank_corrected_inclusive, utj_rank_corrected_measured,
                  utj_pair_eemetric_ssebop, utj_set_a_common, utj_rank_closure,
                  utj_rank_methods]

# Closure, coverage and environmental diagnostics (guide step 12; D-051, D-052). Every value
# here is a Provisional default fixed before any conditional error was computed: bin edges
# are round physical values chosen from the variables' declared meaning (never from errors),
# and min_bin_days is a sample-size floor. Station meteorology units were confirmed by the
# user on 2026-10-16, with US-UTJ.ini as supporting metadata (D-053). Variables whose meaning
# is still unresolved are declared `unverified`, so their diagnostics report not_available
# with the reason. Conditional errors are associations, not causes;
# corrected/raw differences are reference sensitivity, not uncertainty bounds.
diagnostics:
  - diagnostics_id: utj_diagnostics
    metric_set: utj_metrics
    metrics: [mbe, mae, rmse]
    min_bin_days: 20                  # Provisional: fewer days -> sparse_bin, no value
    bootstrap: utj_block_bootstrap    # 7/14/28-day blocks side by side; no length adopted (D-048)
    calendar: [season, month]
    gap_filled_fraction_edges: [0, 0.25, 0.5, 0.75, 1]   # month share of gap-filled days
    provenance_subsets: true          # corrected_from_raw vs all accepted days (D-005)
    closure: true
    closure_metadata: [ebr, ebr_corr, ebr_5day_clim]
    sensible_heat_variable: h_daily
    net_radiation_variable: rn_daily
    wind_direction_variable: null     # no wind direction in the daily table
    comparisons: [utj_rank_corrected_inclusive, utj_rank_corrected_measured,
                  utj_pair_eemetric_ssebop, utj_set_a_common, utj_rank_closure,
                  utj_rank_methods, utj_closure_all_models]
    variables:
      eto_gridmet:
        source: station
        column: src_gridMET_ETo
        units: mm/day
        meaning: gridMET grass reference ET (daily); also drives the station gap fill via ETr
        status: verified              # user-confirmed 2026-10-16 (D-053)
        edges: [0, 2, 4, 6, 8, .inf]
      vpd:
        source: station
        column: src_vpd
        units: kPa
        meaning: daily vapour pressure deficit at the station (flux-data-qaqc)
        status: verified              # user-confirmed kPa (D-053); the .ini's hPa is the half-hourly input
        edges: [0, 0.5, 1.0, 1.5, 2.0, 2.5, .inf]
      wind_speed:
        source: station
        column: src_ws_1_1_1
        units: m s-1
        meaning: daily mean wind speed at the station; measurement height not recorded
        status: verified              # user-confirmed m/s; .ini WS in m/s (D-053)
        edges: [0, 1.0, 1.5, 2.0, 3.0, .inf]
      h_daily:
        source: station
        column: src_h_1_1_1
        units: W m-2
        meaning: daily-mean sensible heat flux (not daytime); negative values are a daily-mean indicator only
        status: verified              # user-confirmed; .ini H in W/m2 (D-053)
        edges: [-.inf, 0, 25, 50, .inf]
      rn_daily:
        source: station
        column: src_netrad_1_1_1_final
        units: W m-2
        meaning: daily-mean net radiation (coupling diagnostic predictor)
        status: verified              # user-confirmed; .ini NETRAD in W/m2 (D-053)
      ebr_corr:
        source: station
        column: src_ebr_corr
        units: "1"
        meaning: energy-balance ratio used for the correction (= 1 / ebc_cf, verified 458/458)
        status: verified
        edges: [0, 0.7, 0.8, 0.9, .inf]
        measured_days_only: true      # no closure meaning on gap-filled days (D-004)
      ebr:
        source: station
        column: src_ebr
        units: "1"
        meaning: daily energy-balance ratio before smoothing; window/method unresolved
        status: provisional           # dimensionless; closure method and window still unresolved
      ebr_5day_clim:
        source: station
        column: src_ebr_5day_clim
        units: "1"
        meaning: 5-day climatology energy-balance ratio (fallback); window unresolved
        status: provisional           # dimensionless; closure method and window still unresolved
      retained_frac:
        source: extraction
        column: fp_weight_retained_frac
        units: "1"
        meaning: footprint weight retained after model nodata, over the truncated footprint (D-029)
        status: verified
        edges: [0, 0.8, 0.9, 0.99, .inf]   # open top: 545 rows exceed 1 by round-off (<= 4.5e-16)
      domain_capture:
        source: extraction
        column: fp_domain_capture_frac
        units: "1"
        meaning: original modeled-domain capture of the footprint (D-029); not built for the NLDAS set
        status: verified
        edges: [0, 0.9, 1.0, .inf]
      h_subday_gaps:
        source: station
        column: src_H_subday_gaps
        units: unknown
        meaning: subdaily H gap diagnostic
        status: unverified
        note: counts, units and denominators are unresolved (contract 10); null is not zero gaps
        edges: [0, 1, 48]
      le_subday_gaps:
        source: station
        column: src_LE_subday_gaps
        units: unknown
        meaning: subdaily LE gap diagnostic
        status: unverified
        note: counts, units and denominators are unresolved (contract 10); null is not zero gaps
        edges: [0, 1, 48]
      rh:
        source: station
        column: src_rh
        units: "%"
        meaning: daily relative humidity (0-100 %)
        status: verified              # user-confirmed; .ini RH_1_1_1 in % (D-053)
        # No bins: VPD is the declared humidity condition. Bins are not added after errors were seen.

# Landscape representativeness (guide step 13; D-054 to D-057). Inputs were declared by the
# user on 2026-10-17: Annual NLCD (Collection 1 v1.2), the 2024 CDL (30 m) and the field
# polygons of Bluff.gpkg (CRS EPSG:26912 and tower field 4940083 declared by the user; the
# file carries no CRS). Every analysis setting is a Provisional default fixed before any
# landscape value was computed. Both matching policies are reported side by side and none
# is adopted. Fractions and labels describe each support's landscape; they are not ET
# accuracy guarantees. tools/run_representativeness.py runs this section.
x-nlcd-legend: &nlcd_legend   # NLCD class names from the product XML (edom); 250 = NoData
  11: Open Water
  12: Perennial Ice/Snow
  21: Developed, Open Space
  22: Developed, Low Intensity
  23: Developed, Medium Intensity
  24: Developed, High Intensity
  31: Barren Land (Rock/Sand/Clay)
  41: Deciduous Forest
  42: Evergreen Forest
  43: Mixed Forest
  52: Shrub/Scrub
  71: Grassland/Herbaceous
  81: Pasture/Hay
  82: Cultivated Crops
  90: Woody Wetlands
  95: Emergent Herbaceous Wetlands
representativeness:
  - representativeness_id: utj_landscape
    site_id: US-UTJ
    footprint_sets: [US-UTJ_nldas_eto_20261014]   # primary footprints (D-037)
    start: "2024-06-05"
    end: "2025-10-09"
    matching_policies: [nearest, previous_only]   # Provisional; both reported, none adopted
    contour_levels: [0.8]             # Provisional; the 80 % contour of Chu et al. (2021)
    methods: [footprint, pixel_window, nearest_tower_pixel, polygon]
    window_sizes: [3]                 # the step-5 pixel_window_3x3 (D-029)
    # One OpenET raster supplies the model grid of the pixel supports; its grid id must equal
    # the step-5 model grid. (The Drive folder moved to unclipped/ after step 5.)
    reference_grid_raster: "M:/My Drive/OpenET_Daily_Tiffs/unclipped/US-UTJ_US-CdM/ensemble/US-CdM_US-UTJ_ensemble_et_2025_06_15_2b83d.tif"
    reference_grid_id: bc933ed96e16809f
    negative_weight_tolerance: 1.0e-9 # as the step-5 extraction (D-027)
    layers:
      nlcd:
        kind: categorical
        source: "USGS Annual NLCD Collection 1 v1.2 (June 2026) land cover, tile H09V10, 30 m"
        crs: "+proj=aea +lat_0=23 +lon_0=-96 +lat_1=29.5 +lat_2=45.5 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
        nodata: 250
        legend: *nlcd_legend
        assets:
          - {path: ../NLCD/Annual_NLCD_H09V10_LndCov_2023_CU_C1V2.tif, vintage: 2023}
          - {path: ../NLCD/Annual_NLCD_H09V10_LndCov_2024_CU_C1V2.tif, vintage: 2024}
          - {path: ../NLCD/Annual_NLCD_H09V10_LndCov_2025_CU_C1V2.tif, vintage: 2025}
      cdl:
        kind: categorical
        source: "USDA NASS Cropland Data Layer 2024, 30 m version (resampled by NASS from the official 10 m CDL)"
        crs: "EPSG:5070"
        nodata: 0                     # Background (Class_Names 0; statistics exclude 0)
        legend_csv: legends/cdl_2024_legend.csv   # Class_Names of the product's .aux
        assets:
          - {path: ../2024_30m_cdls/2024_30m_cdls.tif, vintage: 2024}
    polygons:
      - polygon_id: tower_field
        path: ../Bluff.gpkg
        layer: bluff_fields
        crs: "EPSG:26912"             # user-declared 2026-10-17; the file has no CRS
        id_column: fieldid
        feature_id: "4940083"         # user-declared tower field (alfalfa, sprinkler)
        source: "Bluff.gpkg layer bluff_fields (water-related land-use attributes)"
        vintage: unknown
    fluxfootprints_labels:            # labels only, never a metric or threshold
      layers: [nlcd, cdl]
      radii: [250, 500, 1000, 1500, 2000, 3000]   # fluxfootprints TARGET_RADII (Chu et al. 2021)
      alpha: 0.05                     # fluxfootprints DEFAULT_ALPHA

# Satellite support (guide step 13; D-011, D-057). No authoritative per-pixel or per-site
# clear-observation metadata exists for the OpenET models (user, 2026-10-17), so every
# analysis reports not_available. Nothing is inferred from missing rows, filenames, scene
# dates or daily values, and scene-level Landsat cloud cover is not a pixel-clear flag.
satellite_support:
  - satellite_support_id: utj_satellite_support
    metric_set: utj_metrics
    metrics: [mbe, mae, rmse]
    min_subset_days: 20               # Provisional; the step-12 min_bin_days floor
    sources: []                       # none declared (D-011)
    comparisons: [utj_rank_corrected_inclusive, utj_rank_corrected_measured,
                  utj_pair_eemetric_ssebop, utj_set_a_common]

# Station events (guide step 14; D-059, D-060). Events come only from the station event
# log, never from model residuals. Cuttings are the only US-UTJ management events; the
# log has no US-UTJ irrigation events, and none is inferred. Station visits and program
# updates (including the 2025-07-15 IRGASON move) are instrument events: kept visible as
# overlaps, never analysed as treatments.
event_tables:
  - name: utj_station_events
    path: ../eddy_events_202610171141.csv   # local only (D-014); sha256 ea3ca891...f34698
    columns:
      event_id: event_id
      site: stationid
      timestamp: event_date
      event_type: event_type
      event_source: event_source
      observer: observer
      notes: event_notes
    timestamp_format: "%Y-%m-%d %H:%M:%S.%f"
    timestamp_timezone: "UTC-07:00"   # user-provided: the log uses station time (D-002)
    day_rule: station_local_date      # calendar date of the timestamp; nothing is shifted
    site_mapping: {US-UTJ: US-UTJ}
    site_windows:
      US-UTJ: {start: "2024-06-05", end: "2025-10-09"}   # the station daily record
    event_types:
      cutting: {category: management, management_kind: cutting}
      station visit: {category: instrument}
      program update: {category: instrument}
    evidence_classes:                 # an unlabelled source is always unknown
      camera: photo_observation
      Planet imagery: remote_sensing_inference
      Sentinel NDVI: remote_sensing_inference
      eddy: station_log               # program updates: the logger the update went to
      met: station_log
      both: station_log
    # The date, not another quantity, must be called approximate ("depth approximate" in
    # another station's note does not match).
    approximate_date_patterns:
      - '\bdate\s+(?:is\s+)?approximate\b'
      - '\bapproximate\s+date\b'
    # The farm records confirm all six cuttings (user, 2026-10-17). The logged event_source
    # (Planet imagery or camera) and its evidence class stay as logged.
    management_records:
      - record: farm records
        confirmed_by: user
        confirmed_on: "2026-10-17"
        event_ids: ["805", "804", "708", "709", "801", "710"]
        note: "2024-06-11, 2024-07-19, 2024-09-08, 2025-05-28, 2025-07-05, 2025-09-07"

# Management-event responses (guide step 14; D-061). Provisional defaults chosen by the
# assistant at the user's request (2026-10-17), fixed before any response was computed and
# not tuned on agreement. Uncontrolled before/after design: never causal evidence.
event_analyses:
  - event_analysis_id: utj_cutting_response
    event_table: utj_station_events
    management_kinds: [cutting]
    pre_days: 7                       # baseline: the week before the cut
    post_offset_days: 1               # day 0 (cut day, part cut) is left out
    post_days: 7                      # the week after the cut
    min_window_completeness: 0.7      # >= 5 of 7 days
    baseline_min_mm: 0.5              # mm/day; below it no relative change or recovery
    recovery_fraction: 0.9
    recovery_max_days: 28             # shorter than the shortest cutting interval (38 days)
    recovery_smoothing_days: 3        # trailing mean, all three days present
    approximate_policy: flag          # 2024-09-08 kept, flagged
    weather_variables:
      reference_et: {column: src_gridMET_ETr, units: mm/day, aggregation: mean,
                     meaning: "gridMET alfalfa reference ET (shared with gap-filling, D-005)"}
      precipitation: {column: src_gridMET_prcp, units: mm, aggregation: sum,
                      meaning: gridMET precipitation}
    normalize_by: reference_et
    comparisons: [utj_rank_corrected_inclusive, utj_rank_corrected_measured,
                  utj_pair_eemetric_ssebop, utj_coverage]

# Anomalies (guide step 14; D-061). Provisional defaults, as above. The record holds no
# complete year, so the held-out climatology reports insufficient_training_years by design;
# the moving-mean detrending is exploratory and in sample.
anomalies:
  - anomaly_id: utj_anomaly_climatology
    metric_set: utj_metrics
    method: held_out_climatology
    metrics: [mbe, mae, rmse, pearson_r]
    min_days: 20                      # the step-12 floor
    fold_unit: water_year
    water_year_start_month: 10
    climatology_half_window_days: 15
    min_training_values: 20
    min_training_years: 2
    leap_day: as_feb28
    comparisons: [utj_rank_corrected_inclusive, utj_rank_corrected_measured,
                  utj_pair_eemetric_ssebop]
  - anomaly_id: utj_anomaly_exploratory
    metric_set: utj_metrics
    method: exploratory_moving_mean
    metrics: [mbe, mae, rmse, pearson_r]
    min_days: 20
    window_days: 31
    min_window_completeness: 0.7
    comparisons: [utj_rank_corrected_inclusive, utj_rank_corrected_measured,
                  utj_pair_eemetric_ssebop]

# Water balance (guide step 15; D-062, D-063). A plausibility check of the tower field, never
# ET error and never a basis for choosing a model, reference, filter or footprint. Every term
# is declared; a term without an input is unknown (never zero), so the residual stays unknown
# until irrigation, capillary rise, runoff, deep percolation and storage change have inputs.
# The station gauge p_1_1_1 is NOT used: its bucket factor was changed after the record
# (D-059), and the user decides whether and how it may be used. All choices below are
# Provisional (assistant, 2026-10-17) until the user confirms them.
water_balances:
  - water_balance_id: utj_tower_field_balance
    site_id: US-UTJ
    period_aggregation: utj_periods   # step-8 periods and calendar denominators (D-041, D-042)
    boundary:
      boundary_id: tower_field
      kind: polygon
      path: ../Bluff.gpkg
      layer: bluff_fields
      crs: "EPSG:26912"               # user-declared 2026-10-17; the file has no CRS
      id_column: fieldid
      feature_id: "4940083"           # user-declared tower field (alfalfa, sprinkler)
      source: "Bluff.gpkg layer bluff_fields (water-related land-use attributes)"
      vintage: unknown
      area_m2: 98147.74
      area_source: "planar area of fieldid 4940083 in the declared EPSG:26912 (equals its shape_area attribute; the acres attribute 24.3 = 98,339 m2, rounded); polygon vintage unknown"
    equation: soil_zone
    sign_convention: inflows_positive
    volumes: true                     # only for terms that cover the field itself
    terms:
      precipitation:
        status: modeled
        source: station_column
        column: src_gridMET_prcp
        units: mm/day                 # gridMET daily precipitation depth (Provisional)
        spatial_support: gridded_cell
        day_definition: unknown       # gridMET day as exported by flux-data-qaqc: unverified
        support_note: "gridMET cell (~4 km) at the station, from the daily export; not the field"
      irrigation:
        status: unknown
        source: none
        reason: "no irrigation depths, timing or diversion records declared (the event log has no US-UTJ irrigation events); regional diversion is not field irrigation"
      capillary_rise:
        status: unknown
        source: none
        reason: "no input"
      et:
        status: measured
        source: station_et
        reference_variant: et_corrected_inclusive   # the only variant with complete months; gap-filled days counted (D-005)
        spatial_support: tower_footprint
        support_note: "EC ET represents the daily-changing footprint, which is never the field"
      runoff:
        status: unknown
        source: none
        reason: "no input"
      deep_percolation:
        status: unknown
        source: none
        reason: "no input"
      storage_change:
        status: unknown
        source: none
        reason: "no soil-moisture series declared (CS655/SoilVue are mentioned in the event log; no daily series, depth or units supplied)"

# Scenario uncertainty (guide step 15; D-063): none declared. Distributions and alternatives
# come only from the user, each with a justification and a dependence structure.
scenarios: []

output_dir: ../outputs
