# US-UTJ declarations from docs/input_contract.md and docs/decisions.md.
# Data paths are local inputs that are not distributed (D-014).
# Relative paths resolve against this file's directory.

stations:
  US-UTJ:
    name: UFLUX Bluff
    timezone: "UTC-07:00"            # user-provided (D-002)
    day_definition: local_standard_time
    interval_label: start            # provisional; from .ini TIMESTAMP_START (D-015 q1)
    latitude: 37.2818
    longitude: -109.5348
    elevation_m: 1281
    land_cover: CRO

# OpenET products: mm/day by API request (D-003); interpolated daily (D-011).
# Day boundary of the OpenET daily product is unresolved -> unknown.
# Raster scaling is declared (D-026): the GeoTIFFs carry no scale/offset tags, and
# their header nodata is -9999 (checked against the declaration on every read).
x-scaling: &scaling {raster_scaling: declared, scale_factor: 1.0, add_offset: 0.0, nodata: -9999.0}
products:
  disalexi: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  eemetric: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  ensemble: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling, is_ensemble: true}
  geesebal: {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  ptjpl:    {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  sims:     {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}
  ssebop:   {units: mm/day, day_definition: unknown, temporal_support: interpolated_daily, version: api_default_unrecorded, <<: *scaling}

site_aliases: {}
model_aliases: {}

station_tables:
  - path: ../US-UTJ_daily.csv
    site_id: US-UTJ
    date_column: date
    date_format: "%Y-%m-%d"
    reference_columns: {et_raw: ET, et_corrected: ET_corr}
    gap_flag_column: ET_gap
    closure_factor_column: ebc_cf
    units: {ET: mm/day, ET_corr: mm/day}   # provisional for station (D-003)

extracted_tables:
  - name: us_utj_set_a
    path: ../station_oet_US-UTJ.parquet
    site_column: station_id
    model_column: model
    date_column: footprint_date
    value_columns:
      ET_fp: upstream_footprint_weighted   # D-006
      ET_mean: source_region_mean          # D-007; region changes daily
    units: {ET_fp: mm/day, ET_mean: mm/day}
    footprint_set_id: US-UTJ_set_A_20261005
    footprint_method: et_weighted_unverified   # D-009
    weight_sum_column: unity_check
    retained_weight_column: valid_weight_fraction
    retained_weight_denominator: normalized_truncated_footprint   # D-008
    model_asset_column: openet_file
    footprint_asset_column: footprint_file
    source_path_column: openet_path

openet_rasters:
  - root: "M:/My Drive/OpenET_Daily_Tiffs/US-UTJ_US-CdM"

footprint_sets:
  - set_id: US-UTJ_set_A_20261005
    root: "M:/My Drive/footprints/US-UTJ"
    recursive: false                   # set B lives in weighted/ (D-016)
    layers: [etw]
    weighting_method: et_weighted_unverified
    temporal_weighting: unknown          # ET variable (measured LE vs NLDAS) unverified (D-009, D-032)
    value_semantics: normalized_cell_weight

  # Set B (2026-10-12) is the set used for raster re-extraction (D-016).
  - set_id: US-UTJ_set_B_etw_20261012
    root: "M:/My Drive/footprints/US-UTJ/weighted"
    layers: [etw]
    weighting_method: et_weighted_unverified       # negative weights present (D-027)
    temporal_weighting: unknown                    # may be measured-ET weighted (D-032)
    value_semantics: normalized_cell_weight
    domain_capture_csv: "M:/My Drive/footprints/domain_outputs/US-UTJ_daily_domain_results.csv"
    domain_capture_column: et_weighted_coverage_pct
  - set_id: US-UTJ_set_B_mean_20261012
    root: "M:/My Drive/footprints/US-UTJ/non_weighted"
    layers: [mean]
    weighting_method: time_mean_unverified
    temporal_weighting: time_mean                  # uses no ET, so target-independent (D-032)
    value_semantics: normalized_cell_weight
    domain_capture_csv: "M:/My Drive/footprints/domain_outputs/US-UTJ_daily_domain_results.csv"
    domain_capture_column: mean_coverage_pct

raster_extractions:
  - name: us_utj_set_b_etw
    site_id: US-UTJ
    footprint_set_id: US-UTJ_set_B_etw_20261012
    methods: [footprint, footprint_common_support, pixel_window, nearest_tower_pixel]
    window_sizes: [3]
    negative_weight_tolerance: 1.0e-9   # round-off only (D-027)
    start: "2024-06-05"                 # station record (contract 4.1)
    end: "2025-10-09"
  # Step 6: the set-B time-mean layer, extracted with the same footprint methods and
  # tolerance so it can be compared with etw on frozen dates.
  - name: us_utj_set_b_mean
    site_id: US-UTJ
    footprint_set_id: US-UTJ_set_B_mean_20261012
    methods: [footprint, footprint_common_support]
    negative_weight_tolerance: 1.0e-9
    start: "2024-06-05"
    end: "2025-10-09"

output_dir: ../outputs
