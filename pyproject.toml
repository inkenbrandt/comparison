[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "etcompare"  # working name; check availability before distributing
dynamic = ["version"]
description = "Compare OpenET model estimates against quality-controlled eddy covariance station ET."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["evapotranspiration", "OpenET", "eddy covariance", "flux footprint", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# Lower bounds, not pins: the oldest releases tested with `uv run --resolution lowest-direct`.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6.0.1",
]

[project.urls]
Repository = "https://github.com/inkenbrandt/comparison"

[project.scripts]
etcompare = "etcompare.cli:main"

[project.optional-dependencies]
# Raster extraction (guide step 5+). The tabular core never imports these.
geo = [
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14",
]
plot = ["matplotlib>=3.8"]
# fluxfootprints (optional representativeness labels, guide step 13) is deliberately not an
# extra: it needs numpy >= 2, and as an extra it would raise the lowest-direct floors of the
# whole project (D-018). It is installed into the dev venv from the sibling checkout with
# `uv pip install -e ../footprints` and called only through
# etcompare.adapters.fluxfootprints_labels (D-056).

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Sphinx documentation (docs/; Read the Docs installs docs/requirements.txt).
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.hatch.version]
path = "src/etcompare/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/etcompare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: uses local user-supplied data; skipped when the files are absent",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded YAML configurations: one flow mapping per line reads better than wrapping.
"src/etcompare/demo.py" = ["E501"]
"tests/test_workflow.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["etcompare"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
